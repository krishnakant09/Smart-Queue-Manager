{% extends 'base.html' %}

{% block title %}Notice - Smart Queue Manager{% endblock %}

{% block content %}
<div style="max-width: 520px; margin: 4rem auto; text-align: center;">
  <div class="glass-panel" style="padding: 3rem 2rem;">
    <div style="width: 70px; height: 70px; border-radius: 50%; background: rgba(244, 63, 94, 0.15); color: var(--danger); font-size: 2.2rem; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 1.5rem; border: 1px solid rgba(244, 63, 94, 0.3);">
      <i class="fas fa-exclamation"></i>
    </div>
    
    <h1 style="font-size: 2rem; margin-bottom: 0.75rem;">{{ error or 'An error occurred' }}</h1>
    <p style="color: var(--text-muted); font-size: 1rem; margin-bottom: 2rem;">
      We couldn't find the page or resource you requested. Please check the address or return to the main dashboard.
    </p>

    <div style="display: flex; justify-content: center; gap: 1rem;">
      <a href="{{ url_for('index') }}" class="btn btn-primary btn-lg">
        <i class="fas fa-home"></i> Return to Home
      </a>
      <a href="{{ url_for('check_position') }}" class="btn btn-secondary btn-lg">
        <i class="fas fa-search"></i> Check Ticket
      </a>
    </div>
  </div>
</div>
{% endblock %}
